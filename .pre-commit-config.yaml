repos:
  - repo: local
    hooks:
    - id: ruff-check
      name: Ruff check
      entry: ruff check
      language: system
      types: [python]
      args: [--fix]
      exclude: ^app/migrations/
    - id: ruff-format
      name: Ruff format
      entry: ruff format
      language: system
      types: [python]
      exclude: ^app/migrations/
